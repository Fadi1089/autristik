# Every branch: lint, format check, tests and a build (which also type-checks).
#
# Releasing: a commit on main with a message starting with "(RELEASE)" is squashed onto
# prod once its tests pass. The push to prod starts a prod pipeline, and only prod
# deploys GitLab Pages. Needs a RELEASE_TOKEN CI/CD variable (see README).
image: node:24-alpine

stages:
  - test
  - release
  - deploy

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  # Branch that GitLab Pages is deployed from.
  PAGES_BRANCH: prod

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

test:
  stage: test
  script:
    - npm run lint
    - npm run format:check
    - npm test
    - npm run build

release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^\(RELEASE\)/
  # One release at a time, so two quick pushes can't race each other to prod.
  resource_group: release
  cache: []
  before_script: []
  script:
    - |
      if [ -z "${RELEASE_TOKEN:-}" ]; then
        echo "RELEASE_TOKEN is not set. Add a project access token with write_repository"
        echo "as a masked CI/CD variable named RELEASE_TOKEN (see README)."
        exit 1
      fi
    - apk add --no-cache git >/dev/null
    # The runner checks the repo out as a different user than the one running this
    # script, and git refuses to touch a repo it doesn't own unless told it's safe.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - remote="$(echo "$CI_SERVER_URL" | sed "s#://#://release:${RELEASE_TOKEN}@#")/$CI_PROJECT_PATH.git"
    - tree="$(git rev-parse "$CI_COMMIT_SHA^{tree}")"
    # Stack the squash on the previous release (if any) so the push is a fast-forward.
    # Whatever prod held before is ignored: the new commit has exactly main's files.
    - |
      parent=""
      found=0
      git ls-remote --exit-code --heads "$remote" "$PAGES_BRANCH" >/dev/null || found=$?
      case "$found" in
        0)
          git fetch --quiet --depth=1 "$remote" "$PAGES_BRANCH"
          parent="$(git rev-parse FETCH_HEAD)"
          if [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$PAGES_BRANCH already matches $CI_COMMIT_SHORT_SHA. Nothing to release."
            exit 0
          fi
          ;;
        2) echo "$PAGES_BRANCH doesn't exist yet; this release creates it." ;;
        *)
          echo "Couldn't reach the repository with RELEASE_TOKEN. Check that the token is"
          echo "valid, has the write_repository scope and at least the Maintainer role."
          exit 1
          ;;
      esac
    - |
      subject="$(printf '%s' "$CI_COMMIT_TITLE" | sed -E 's/^\(RELEASE\)[[:space:]:-]*//')"
      [ -n "$subject" ] || subject="chore(release): $CI_DEFAULT_BRANCH@$CI_COMMIT_SHORT_SHA"
      message="$(printf '%s\n\nReleased from %s at %s.\n' "$subject" "$CI_DEFAULT_BRANCH" "$CI_COMMIT_SHA")"
      if [ -n "$parent" ]; then
        commit="$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$parent")"
      else
        commit="$(printf '%s\n' "$message" | git commit-tree "$tree")"
      fi
      git --no-pager log -1 --format='%h %s%n%n%b' "$commit"
      git push --quiet "$remote" "$commit:refs/heads/$PAGES_BRANCH"
      echo "Pushed to $PAGES_BRANCH. Its pipeline deploys GitLab Pages."

pages:
  stage: deploy
  # Runs after the test job has passed for the same commit.
  rules:
    - if: $CI_COMMIT_BRANCH == $PAGES_BRANCH
  script:
    # Serve assets under the Pages sub-path. Taking it from CI_PAGES_URL also covers
    # instances with custom Pages domains and projects with "unique domain" enabled
    # (where the site lives at the domain root and the path is just "/").
    - |
      if [ -z "${BASE_PATH:-}" ]; then
        if [ -n "${CI_PAGES_URL:-}" ]; then
          BASE_PATH="$(echo "$CI_PAGES_URL" | sed -E 's#^https?://[^/]+##; s#/+$##')/"
        else
          BASE_PATH="/$CI_PROJECT_NAME/"
        fi
      fi
      export BASE_PATH
    - echo "Building with BASE_PATH=$BASE_PATH"
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths:
      - public
  environment:
    name: pages
    url: $CI_PAGES_URL
